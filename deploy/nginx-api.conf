# /etc/nginx/sites-available/api.example.ir  (برای بک‌اند لاراول)
server {
    listen 80;
    server_name api.example.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.ir;

    ssl_certificate     /etc/letsencrypt/live/api.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.ir/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/arezoo-backend/public;
    index index.php;

    client_max_body_size 12m;   # آپلود مدارک و تصویر

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # نسخه PHP سرورت
    }

    location ~ /\.(?!well-known).* { deny all; }
}
