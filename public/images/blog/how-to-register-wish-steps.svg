<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="چهار مرحله ثبت آرزو">
  <rect width="1200" height="420" rx="28" fill="#f8f8fc"/>
  <g font-family="Tahoma, Vazirmatn, sans-serif" text-anchor="middle">
    <g transform="translate(1020 70)"><circle cx="0" cy="60" r="56" fill="#6d5dfc"/><text y="78" font-size="52" font-weight="700" fill="#fff">۱</text><text y="170" font-size="26" font-weight="700" fill="#1f2937">عنوان و دسته</text></g>
    <g transform="translate(740 70)"><circle cx="0" cy="60" r="56" fill="#6d5dfc"/><text y="78" font-size="52" font-weight="700" fill="#fff">۲</text><text y="170" font-size="26" font-weight="700" fill="#1f2937">داستان آرزو</text></g>
    <g transform="translate(460 70)"><circle cx="0" cy="60" r="56" fill="#6d5dfc"/><text y="78" font-size="52" font-weight="700" fill="#fff">۳</text><text y="170" font-size="26" font-weight="700" fill="#1f2937">شهر و مبلغ</text></g>
    <g transform="translate(180 70)"><circle cx="0" cy="60" r="56" fill="#6d5dfc"/><text y="78" font-size="52" font-weight="700" fill="#fff">۴</text><text y="170" font-size="26" font-weight="700" fill="#1f2937">اطلاعات و مدارک</text></g>
  </g>
  <path d="M960 130H800M680 130H520M400 130H240" stroke="#cfc9ff" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/>
  <text x="600" y="350" font-family="Tahoma, Vazirmatn, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle">بعد از ثبت، تیم آرزو درخواست را بررسی می‌کند</text>
</svg>
